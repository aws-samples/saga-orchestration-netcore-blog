version: 0.2
env:
  variables:
    DOTNET_ROOT: /root/.dotnet
phases:
  install:
    runtime-versions:
      dotnet: 10.0
  pre_build:
    commands:
      - echo Restore started on `date`
      - export PATH="$PATH:/root/.dotnet/tools"

  build:
    commands:
      - DB_IMG_PATH=$PWD
      - cd Lambdas/MakePaymentLambda/src/MakePaymentLambda
      - dotnet clean
      - dotnet restore
      - echo Build started on `date`
      - dotnet new -i Amazon.Lambda.Templates::*
      - dotnet tool install -g Amazon.Lambda.Tools
      - dotnet tool update -g Amazon.Lambda.Tools
      - dotnet build -c Release MakePaymentLambda.csproj
      - dotnet test -c Release ../../test/MakePaymentLambda.Tests/MakePaymentLambda.Tests.csproj
      - dotnet lambda deploy-function "MakePaymentLambda" --function-role "arn:aws:iam::119176563765:role/AwsomeLambdaExecutionRole" --region "ap-southeast-2"
      - cd "$DB_IMG_PATH"
      - pwd